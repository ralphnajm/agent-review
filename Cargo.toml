[package]
name = "agent-review"
version = "1.0.0-alpha.2"
edition = "2024"
rust-version = "1.99"
description = "Review the changes coding agents make and hand your feedback back to them"
license = "MIT"
repository = "https://github.com/ralphnajm/agent-review"
readme = "README.md"
keywords = ["git", "review", "agent", "gtk", "diff"]
categories = ["development-tools"]
publish = false

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
notify = { version = "8.2.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sourceview5 = { version = "0.11.2", features = ["v5_12"] }
webkit6 = { version = "0.6.1", features = ["v2_44"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Widget construction functions are long by nature.
too_many_lines = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
new_without_default = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "allow"
print_stdout = "warn"

# Packaging: `cargo deb` (Debian/Ubuntu) and `cargo generate-rpm` (Fedora).
# Both expect `cargo build --release` to have run first.
[package.metadata.deb]
name = "agent-review"
maintainer = "Ralph Najem <me@ralphnajem.com>"
section = "devel"
priority = "optional"
depends = "$auto, git"
extended-description = "A native GTK app for reviewing the uncommitted changes coding agents make: browse staged and unstaged changes per project, comment on lines and files, mark files as reviewed, and post the feedback for your agent to pull or copy it to paste."
assets = [
    ["target/release/agent-review", "usr/bin/", "755"],
    ["data/io.github.ralphnajm.AgentReview.desktop", "usr/share/applications/", "644"],
    ["data/io.github.ralphnajm.AgentReview.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/hicolor/scalable/apps/io.github.ralphnajm.AgentReview.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/hicolor/symbolic/apps/io.github.ralphnajm.AgentReview-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
]

[package.metadata.generate-rpm]
summary = "Review the changes coding agents make"
assets = [
    { source = "target/release/agent-review", dest = "/usr/bin/agent-review", mode = "755" },
    { source = "data/io.github.ralphnajm.AgentReview.desktop", dest = "/usr/share/applications/io.github.ralphnajm.AgentReview.desktop", mode = "644" },
    { source = "data/io.github.ralphnajm.AgentReview.metainfo.xml", dest = "/usr/share/metainfo/io.github.ralphnajm.AgentReview.metainfo.xml", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/io.github.ralphnajm.AgentReview.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.ralphnajm.AgentReview.svg", mode = "644" },
    { source = "data/icons/hicolor/symbolic/apps/io.github.ralphnajm.AgentReview-symbolic.svg", dest = "/usr/share/icons/hicolor/symbolic/apps/io.github.ralphnajm.AgentReview-symbolic.svg", mode = "644" },
]
# Use rpm-build's find-requires: the built-in scanner emits glibc requirements dnf cannot resolve.
auto-req = "find-requires"

[package.metadata.generate-rpm.requires]
git = "*"
gtk4 = ">= 4.14"
libadwaita = ">= 1.5"
gtksourceview5 = ">= 5.12"
"webkitgtk6.0" = ">= 2.44"
